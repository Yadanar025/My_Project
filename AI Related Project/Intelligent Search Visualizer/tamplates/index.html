<!DOCTYPE html>
<html>
    <head>
        <title>Map Algorithm</title>
        <link rel = "stylesheet" href = "https://unpkg.com/leaflet/dist/leaflet.css"/>
        <script src="https://unpkg.com/leaflet/dist/leaflet.js"></script>
        <style>
            #map {height:600px; width:100%;}
        </style>
    </head>
    <body>
        <h1>Myanmar Road Location Suggestion</h1>
        <div>
            <label> Start Destination City:</label>
            <select id = "start_city">
                {% for city in cities %}
                <option value="{{city}}">{{city}}</option>
                {% endfor %}
            </select>
            <label> Goal City:</label>
            <select id = "distination_city">
                {% for city in cities %}
                <option value="{{city}}">{{city}}</option>
                {% endfor %}
            </select>
            <label>Search Algorithm:</label>
            <select id="algorithm">
                <option value="BFS">BFS</option>
                <option value="DFS">DFS</option>
                <option value="UCS">UCS</option>
                <option value="IDS">IDS</option>
                <option value="Greedy Best First Search">Greedy Best First Search</option>
                <option value="A* Search">A* Search</option>    
            </select>
            <button onclick="runSearch()">Search Route</button>
        </div>
        <div id="map"></div>
        <script>
            var map = L.map("map").setView([21.9747, 96.0836], 6);
            L.tileLayer("https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png", {
                attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a> contributors'
            }).addTo(map);
            var coordinates = {{coordinates | tojson }};
            var routeLayer = null;
            function runSearch(){
                var start=document.getElementById("start_city").value;
                var goal = document.getElementById("distination_city").value;
                var algorithm = document.getElementById("algorithm").value;
                var formData = new URLSearchParams();
                formData.append("start_city",start);
                formData.append("distination_city",goal);
                formData.append("algorithm",algorithm);
                fetch("/search",{
                    method: "POST",
                    body : formData
                })
                .then(response => response.json())
                .then(data => {
                    console.log(data);
                    drawRoute(data.path);                    
                });
            function drawRoute(path){
                if (routeLayer) {
                    map.removeLayer(routeLayer);
                }
                var latlngs = path.map(city=>coordinates[city]);
                routeLayer = L.layerGroup();
                latlngs.forEach(function(point){
                    L.marker(point).addTo(routeLayer);
                });
                L.polyline(latlngs,{color:"blue"}).addTo(routeLayer);
                routeLayer.addTo(map);
                map.fitBounds(latlngs)
            }

            }
        </script>
        
    </body>
</html>
